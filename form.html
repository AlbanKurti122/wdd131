<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review</title>
  <meta name="description" content="Submit a detailed product review including ratings, features, and written feedback.">
  <meta name="author" content="Alban Kurti">
  <link rel="stylesheet" href="styles/styles.css">
  <script src="scripts/products.js" defer></script>
</head>
<body>

    <header>
     <h1>Product Review Form</h1>
    </header>

    <main>
      <form method="get" action="review.html" class="review-form">

            <!-- Product Name -->
            <div class="form-group">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset class="form-group">
                <legend>Overall Rating</legend>
                <input type="radio" id="rate1" name="rating" value="1" required>
                <label for="rate1">★</label>
                <input type="radio" id="rate2" name="rating" value="2" required>
                <label for="rate2">★★</label>
                <input type="radio" id="rate3" name="rating" value="3" required>
                <label for="rate3">★★★</label>
                <input type="radio" id="rate4" name="rating" value="4" required>
                <label for="rate4">★★★★</label>
                <input type="radio" id="rate5" name="rating" value="5" required>
                <label for="rate5">★★★★★</label>
            </fieldset>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="install-date">Date of Installation</label>
                <input type="date" id="install-date" name="installDate" required>
            </div>

            <!-- Useful Features -->
           <fieldset class="form-group">
                <legend>Useful Features</legend>

                <input type="checkbox" id="feature1" name="features" value="Ease of Use">
                <label for="feature1">Ease of Use</label>

                <input type="checkbox" id="feature2" name="features" value="Performance">
                <label for="feature2">Performance</label>

                <input type="checkbox" id="feature3" name="features" value="Design">
                <label for="feature3">Design</label>

                <input type="checkbox" id="feature4" name="features" value="Reliability">
                <label for="feature4">Reliability</label>
            </fieldset>

            <!-- Written Review -->
            <div class="form-group">
                <label for="review">Written Review</label>
                <textarea id="review" name="review" rows="4"></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="username">Your Name</label>
                <input type="text" id="username" name="username">
            </div>

            <!-- Submit -->
            <div class="form-group">
              <input type="submit" value="Submit Review">
            </div>

      </form>
    </main>

    <footer>
        <p>
            © <span id="currentyear"></span> Alban Kurti | Albania
        </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
